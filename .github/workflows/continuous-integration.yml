name: Rust checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check licenses
        run: |
          pipx install reuse==6.2.0
          reuse lint
      - name: Check native Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          cargo +1.99.0 check --locked --workspace
          cargo +1.99.0 test --locked --workspace
      - name: Validate Compose without credentials
        run: |
          cp .env.example .env
          docker compose config --quiet
