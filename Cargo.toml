[workspace]
members = ["server", "web"]
default-members = ["server"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"

[profile.release]
strip = true
debug = 0

[profile.release.package.haste-web]
opt-level = "s"

[profile.dev]
debug = 0